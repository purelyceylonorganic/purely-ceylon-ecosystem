name: 🌿 Purely Ceylon Organic - CI/CD Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  test-and-verify:
    name: 🧪 Automated Testing & Code Verification
    runs-on: ubuntu-latest

    steps:
      - name: 📥 1. Clone Repository Code
        uses: actions/checkout@v4

      - name: 🟢 2. Setup Node.js Environment (v20)
        uses: actions/setup-node@v4
        with:
          node-on-version: 20
          cache: 'npm'
          cache-dependency-path: backend/package-json.lock

      - name: 📦 3. Install Backend Dependencies
        run: |
          cd backend
          npm ci

      - name: ⚙️ 4. Generate Prisma Client (Database Integrity Check)
        run: |
          cd backend
          npx prisma generate
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL || 'postgresql://mock:mock@localhost:5432/mock' }}

      - name: 🚀 5. Execute Automated Jest Test Suite
        run: |
          cd backend
          npm run test

  deploy-to-cloud:
    name: 🚀 Production Cloud Deployment
    needs: test-and-verify
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'

    steps:
      - name: 📥 Clone Code for Deployment
        uses: actions/checkout@v4

      - name: 🎉 Trigger Cloud Deployment
        run: |
          echo "⚡ QA Verification Passed! Deploying Purely Ceylon Organic Ecosystem to Production Servers..."
          # இங்கு உங்களது கிளவுட் சர்வர் (Render/AWS/Vercel) டெப்லாய்மென்ட் கமாண்டுகள் இணையும்