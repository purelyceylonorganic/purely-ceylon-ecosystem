name: 🌿 Purely Ceylon Organic - CI/CD Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:

  test-and-verify:
    name: 🧪 Automated Testing & Code Verification
    runs-on: ubuntu-latest

    steps:

      - name: 📥 1. Clone Repository Code
        uses: actions/checkout@v4

      - name: 🟢 2. Setup Node.js Environment
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: 📦 3. Install Backend Dependencies
        working-directory: backend
        run: npm ci

      - name: ⚙️ 4. Generate Prisma Client
        working-directory: backend
        run: npx prisma generate
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL || 'postgresql://mock:mock@localhost:5432/mock' }}

      - name: 🧪 5. Run Automated Tests
        working-directory: backend
        run: npm test

      - name: 🏗️ 6. Verify Production Build
        working-directory: backend
        run: npm run build


  deploy-to-cloud:
    name: 🚀 Production Cloud Deployment
    needs: test-and-verify
    runs-on: ubuntu-latest

    if: github.event_name == 'push' &&
        (github.ref == 'refs/heads/main' ||
         github.ref == 'refs/heads/master')

    steps:

      - name: 📥 Clone Code
        uses: actions/checkout@v4

      - name: 🎉 Deployment Ready
        run: |
          echo "✅ QA Verification Passed"
          echo "✅ Prisma Client Generated"
          echo "✅ Jest Tests Passed"
          echo "✅ TypeScript Build Passed"
          echo "🚀 Ready for Production Deployment"